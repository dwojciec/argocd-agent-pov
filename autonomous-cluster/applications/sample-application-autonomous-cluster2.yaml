# Autonomous-mode demo — apply on AUTONOMOUS spoke only. Prefer .yaml.template with envsubst.
# See docs/validation-applications.md and ACM-implementation/applications/autonomous/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-autonomous-demo
  namespace: argocd
  labels:
    test.argocd-agent-pov/mode: autonomous
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-autonomous
  source:
    repoURL: https://github.com/dwojciec/argocd-agent-pov.git
    path: ACM-implementation/workloads/openshift-demo
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
